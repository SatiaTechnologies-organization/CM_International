<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CMI Blog — News, insights, and stories from the mission field in Kenya.">
    <title>Blog | Christian Mission International</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/cmi.css}" href="/cmi.css">
</head>
<body>
<div th:replace="~{header :: header}"></div>

<main class="blog-page-wrapper">
    <section class="blog-section">

        <div class="blog-grid">

            <!-- Thymeleaf Loop -->
            <article class="blog-card" th:each="post : ${blogPage.content}">
                <div class="blog-img-wrap">
                    <img th:src="${!post.images.isEmpty() ? post.images[0].imageUrl : '/images/placeholder.jpg'}"
                         alt="Blog Image"
                         onerror="this.src='https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=600&q=80'">
                </div>
                <div class="blog-content">
                    <div class="blog-meta">
                        <span class="category" th:attr="data-en=${post.categoryEn}, data-de=${post.categoryDe}" th:text="${post.categoryEn}">CATEGORY</span>
                        <span class="date" th:text="${#temporals.format(post.dateCreated, 'MMM dd, yyyy')}">DATE</span>
                    </div>

                    <h2 th:attr="data-en=${post.titleEn}, data-de=${post.titleDe}" th:text="${post.titleEn}">Title</h2>

                    <!-- FALLBACK LOGIC: If contentEn is empty, show the first image's description -->
                    <p th:attr="data-en=${post.contentEn}, data-de=${post.contentDe}"
                       th:text="${!#strings.isEmpty(post.contentEn) ? #strings.abbreviate(post.contentEn, 120) : (post.images.size() > 0 ? #strings.abbreviate(post.images[0].descriptionEn, 120) : '')}">
                        Excerpt...
                    </p>

                    <!-- Views and Likes -->
                    <div class="blog-footer-stats">
                        <span><i class="fa-regular fa-eye"></i> <span th:text="${post.views}">0</span> Views</span>
                        <span class="likes-count"><i class="fa-solid fa-heart"></i> <span th:text="${post.likes}">0</span></span>
                    </div>

                    <a th:href="@{/blog/post/{id}(id=${post.id})}" class="story-link" data-en="Read article →" data-de="Artikel lesen →">Artikel lesen →</a>
                </div>
            </article>

        </div>

        <!-- PAGINATION -->
        <div class="blog-pagination">
            <a th:if="${blogPage.hasPrevious()}" th:href="@{/blog(page=${blogPage.number - 1})}" class="page-item">&lt;</a>

            <a th:each="i : ${#numbers.sequence(0, blogPage.totalPages - 1)}"
               th:href="@{/blog(page=${i})}"
               th:text="${i + 1}"
               th:classappend="${i == blogPage.number} ? 'active' : ''"
               class="page-item">1</a>

            <a th:if="${blogPage.hasNext()}" th:href="@{/blog(page=${blogPage.number + 1})}" class="page-item">&gt;</a>
        </div>
    </section>
</main>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/js/cmi.js}" src="/js/cmi.js"></script>
</body>
</html>
