<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Blog | Admin</title>
    <link rel="stylesheet" th:href="@{/cmi.css}">
</head>
<body style="background: #f4f6f8; margin: 0;">

<div th:replace="~{admin-header :: admin-header}"></div>

<div class="admin-wrapper">
    <div class="admin-header">
        <h2>Blog Management</h2>
        <div class="admin-nav">
            <a th:href="@{/blog}" class="btn-admin outline" target="_blank">View Live Blog</a>
            <a th:href="@{/admin/blog/new}" class="btn-admin">+ Create Blog Post</a>
        </div>
    </div>

    <table class="admin-table">
        <thead>
        <tr>
            <th>Date</th>
            <th>Title (EN)</th>
            <th>Category</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${#temporals.format(post.dateCreated, 'MMM dd, yyyy')}" style="font-weight: 600; color: #174d2e;"></td>
            <td th:text="${post.titleEn}" style="font-weight: 600;"></td>
            <td th:text="${post.categoryEn}"></td>
            <td>
                <a th:href="@{/admin/blog/delete/{id}(id=${post.id})}" class="btn-delete" onclick="return confirm('Are you sure you want to delete this blog post?');">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(posts)}">
            <td colspan="4" style="text-align: center; padding: 30px;">No blog posts found. Click "+ Create Blog Post" to add one.</td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/js/cmi.js}" src="/js/cmi.js"></script>
</body>
</html>
