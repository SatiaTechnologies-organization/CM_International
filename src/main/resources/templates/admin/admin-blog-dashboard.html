<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Blog | Admin</title>
    <link rel="stylesheet" th:href="@{/cmi.css}">
</head>
<body style="background: #f4f6f8; margin: 0;">

<div th:replace="~{admin-header :: admin-header}"></div>

<div class="admin-wrapper">
    <div class="admin-header">
        <h2 data-en="Blog Management" data-de="Blog-Verwaltung">Blog-Verwaltung</h2>
        <div class="admin-nav">
            <a th:href="@{/blog}" class="btn-admin outline" target="_blank" data-en="View Live Blog" data-de="Live-Blog ansehen">Live-Blog ansehen</a>
            <a th:href="@{/admin/blog/new}" class="btn-admin" data-en="+ Create Blog Post" data-de="+ Blogbeitrag erstellen">+ Blogbeitrag erstellen</a>
        </div>
    </div>

    <table class="admin-table">
        <thead>
        <tr>
            <th data-en="Date" data-de="Datum">Datum</th>
            <th data-en="Title (EN)" data-de="Titel (EN)">Titel (EN)</th>
            <th data-en="Category" data-de="Kategorie">Kategorie</th>
            <th data-en="Actions" data-de="Aktionen">Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${#temporals.format(post.dateCreated, 'MMM dd, yyyy')}" style="font-weight: 600; color: #174d2e;"></td>

            <!-- TRANSLATION ADDED HERE -->
            <td th:attr="data-en=${post.titleEn}, data-de=${post.titleDe}"
                th:text="${post.titleEn}"
                style="font-weight: 600;"></td>

            <!-- TRANSLATION ADDED HERE -->
            <td th:attr="data-en=${post.categoryEn}, data-de=${post.categoryDe}"
                th:text="${post.categoryEn}"></td>

            <td>
                <a th:href="@{/admin/blog/delete/{id}(id=${post.id})}" class="btn-delete" onclick="return confirm('Are you sure you want to delete this blog post?');"
                   data-en="Delete" data-de="Löschen">Löschen</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(posts)}">
            <td colspan="4" style="text-align: center; padding: 30px;"
                data-en="No blog posts found." data-de="Keine Blogbeiträge gefunden.">Keine Blogbeiträge gefunden.</td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/cmi.js}" src="/cmi.js"></script>
</body>
</html>
