<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage News | Admin</title>
    <link rel="stylesheet" th:href="@{/cmi.css}">
</head>
<body style="background: #f4f6f8; margin: 0;">

<div th:replace="~{admin-header :: admin-header}"></div>

<div class="admin-wrapper">
    <div class="admin-header">
        <h2>News Management</h2>
        <div class="admin-nav">
            <a th:href="@{/news}" class="btn-admin outline" target="_blank">View Live News</a>
            <a th:href="@{/admin/news/new}" class="btn-admin">+ Create News Post</a>
        </div>
    </div>

    <table class="admin-table">
        <thead>
        <tr>
            <th>Date</th>
            <th>Title (EN)</th>
            <th>Title (DE)</th>
            <th>PDF Link</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${newsList}">
            <td th:text="${post.dateText}" style="font-weight: 600; color: #174d2e;"></td>
            <td th:text="${post.titleEn}" style="font-weight: 600;"></td>
            <td th:text="${post.titleDe}"></td>
            <td>
                <a th:if="${post.pdfUrl != null}" th:href="${post.pdfUrl}" target="_blank" style="color: #b99a4c; text-decoration: underline;">View PDF</a>
            </td>
            <td>
                <a th:href="@{/admin/news/delete/{id}(id=${post.id})}" class="btn-delete" onclick="return confirm('Are you sure you want to delete this news post?');">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(newsList)}">
            <td colspan="5" style="text-align: center; padding: 30px;">No news posts found. Click "+ Create News Post" to add one.</td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/js/cmi.js}" src="/js/cmi.js"></script>
</body>
</html>
