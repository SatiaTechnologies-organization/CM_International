<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage News | Admin</title>
    <link rel="stylesheet" th:href="@{/cmi.css}">
</head>
<body style="background: #f4f6f8; margin: 0;">

<div th:replace="~{admin-header :: admin-header}"></div>

<div class="admin-wrapper">
    <div class="admin-header">
        <h2 data-en="News Management" data-de="Neuigkeiten-Verwaltung">Neuigkeiten-Verwaltung</h2>
        <div class="admin-nav">
            <a th:href="@{/news}" class="btn-admin outline" target="_blank" data-en="View Live News" data-de="Live-Neuigkeiten ansehen">Live-Neuigkeiten ansehen</a>
            <a th:href="@{/admin/news/new}" class="btn-admin" data-en="+ Create News Post" data-de="+ Neuigkeit erstellen">+ Neuigkeit erstellen</a>
        </div>
    </div>

    <table class="admin-table">
        <thead>
        <tr>
            <th data-en="Date" data-de="Datum">Datum</th>
            <th data-en="Title (EN)" data-de="Titel (EN)">Titel (EN)</th>
            <th data-en="Title (DE)" data-de="Titel (DE)">Titel (DE)</th>
            <th data-en="PDF Link" data-de="PDF-Link">PDF-Link</th>
            <th data-en="Actions" data-de="Aktionen">Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${newsList}">
            <td th:text="${post.dateText}" style="font-weight: 600; color: #174d2e;"></td>

            <td th:attr="data-en=${post.titleEn}, data-de=${post.titleDe}"
                th:text="${post.titleEn}"
                style="font-weight: 600;"></td>

            <td th:text="${post.titleDe}"></td>

            <td>
                <a th:if="${post.pdfUrl != null and !post.pdfUrl.isEmpty()}"
                   th:href="${post.pdfUrl}" target="_blank"
                   style="color: #b99a4c; text-decoration: underline;"
                   data-en="View PDF" data-de="PDF ansehen">PDF ansehen</a>
            </td>

            <td>
                <a th:href="@{/admin/news/delete/{id}(id=${post.id})}" class="btn-delete"
                   onclick="return confirm('Are you sure you want to delete this news post?');"
                   data-en="Delete" data-de="Löschen">Löschen</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(newsList)}">
            <td colspan="5" style="text-align: center; padding: 30px;"
                data-en="No news posts found." data-de="Keine Neuigkeiten gefunden.">Keine Neuigkeiten gefunden.</td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/cmi.js}" src="/cmi.js"></script>
</body>
</html>
