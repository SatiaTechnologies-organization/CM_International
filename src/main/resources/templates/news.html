<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | CMI</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/cmi.css}" href="/cmi.css">
</head>
<body>

<div th:replace="~{header :: header}"></div>

<main class="news-page">
    <div class="container">
        <article class="post-card" th:each="post : ${newsList}">
            <div class="post-image">
                <img th:src="${post.imageUrl}" alt="News Image">
            </div>
            <div class="post-content">
                <span class="date-badge" th:text="${post.dateText}">Date</span>

                <h2 class="post-title" th:attr="data-en=${post.titleEn}, data-de=${post.titleDe}" th:text="${post.titleEn}">Title</h2>

                <p data-en="Dear family & friends!" data-de="Liebe Familie & Freunde!">Liebe Familie & Freunde!</p>

                <p th:attr="data-en=${post.contentEn}, data-de=${post.contentDe}" th:text="${post.contentEn}">Content...</p>

                <p class="quote-text" th:if="${post.quoteEn != null}" th:attr="data-en=${post.quoteEn}, data-de=${post.quoteDe}" th:text="${post.quoteEn}">Quote...</p>

                <a th:if="${post.pdfUrl != null and !post.pdfUrl.isEmpty()}"
                   th:href="${post.pdfUrl}" target="_blank" class="read-more"
                   data-en="Read full newsletter" data-de="Ganzen Rundbrief lesen">Ganzen Rundbrief lesen</a>
            </div>
        </article>
    </div>
</main>

<div th:replace="~{footer :: footer}"></div>
<script th:src="@{/cmi.js}" src="/cmi.js"></script>
</body>
</html>
